<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Planet Orbit Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #infoPanel {
      position: absolute;
      top: 0; right: 0;
      width: 300px;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      display: none;
      z-index: 10;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="infoPanel">
    <h2 id="planetName">Planet</h2>
    <p><strong>Mass:</strong> <span id="planetMass">--</span></p>
    <p><strong>Orbit Period:</strong> <span id="planetPeriod">--</span></p>
    <p><strong>Distance:</strong> <span id="planetDistance">--</span></p>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 200, 0);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 10;
    controls.maxDistance = 500;

    const light = new THREE.PointLight(0xffffff, 2, 2000);
    light.position.set(0, 0, 0);
    scene.add(light);

    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(5, 64, 64),
      new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 2 })
    );
    scene.add(sun);

    const planetData = [
      { name: 'Mercury', color: 0xaaaaaa, distance: 10, radius: 0.5, speed: 0.04 },
      { name: 'Venus', color: 0xffcc99, distance: 15, radius: 0.6, speed: 0.015 },
      { name: 'Earth', color: 0x00aaff, distance: 20, radius: 0.8, speed: 0.01 },
      { name: 'Mars', color: 0xff5533, distance: 25, radius: 0.6, speed: 0.008 },
      { name: 'Jupiter', color: 0xffaa66, distance: 35, radius: 1.2, speed: 0.004 },
      { name: 'Saturn', color: 0xffddaa, distance: 45, radius: 1.0, speed: 0.002 },
      { name: 'Uranus', color: 0x66ccff, distance: 55, radius: 0.9, speed: 0.001 },
      { name: 'Neptune', color: 0x3366ff, distance: 65, radius: 0.9, speed: 0.0005 }
    ];

    const planets = [];
    const orbitLines = [];

    planetData.forEach(data => {
      const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
      const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.5, roughness: 0.2 });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      mesh.userData = data;
      planets.push({ mesh, angle: Math.random() * Math.PI * 2 });

      const orbitPoints = [];
      for (let i = 0; i <= 360; i++) {
        const theta = THREE.MathUtils.degToRad(i);
        orbitPoints.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
      }
      const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
      const orbitLine = new THREE.Line(orbitGeometry, new THREE.LineBasicMaterial({ color: 0x888888 }));
      scene.add(orbitLine);
      orbitLines.push(orbitLine);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoPanel = document.getElementById('infoPanel');

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));

      if (intersects.length > 0) {
        const planet = intersects[0].object;
        const data = planet.userData;
        document.getElementById('planetName').textContent = data.name;
        document.getElementById('planetMass').textContent = '--';
        document.getElementById('planetPeriod').textContent = '--';
        document.getElementById('planetDistance').textContent = `${data.distance * 10} million km`;
        infoPanel.style.display = 'block';
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      planets.forEach(p => {
        const { mesh } = p;
        const { distance, speed } = mesh.userData;
        p.angle += speed;
        mesh.position.x = Math.cos(p.angle) * distance;
        mesh.position.z = Math.sin(p.angle) * distance;
        mesh.rotation.y += 0.01;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

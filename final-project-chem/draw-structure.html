<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chemical Structure Editor</title>
  <style>
    :root {
      --bg: #e0e5ec;
      --fg: #333;
      --component-bg: #e0e5ec;
      --shadow-light: #ffffff;
      --shadow-dark: #a3b1c6;
      --accent: #4da6ff;
    }
    body.dark {
      --bg: #1f2023;
      --fg: #e0e0e0;
      --component-bg: #1f2023;
      --shadow-light: #2b2c30;
      --shadow-dark: #000;
      --accent: #539bf5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      transition: background 0.3s, color 0.3s;
    }
    h1 {
      margin-bottom: 20px;
      color: var(--accent);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    #themeToggle {
      position: fixed;
      top: 20px; right: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--component-bg);
      border: none;
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      cursor: pointer;
      transition: all 0.3s;
      color: var(--fg);
    }
    #themeToggle:active {
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    }
    .toolbar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .toolbar button {
      padding: 10px 18px;
      background: var(--component-bg);
      color: var(--fg);
      border: none;
      border-radius: 12px;
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .toolbar button:active {
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    }
    #jsme-container {
      margin-top: 30px;
      width: 100%; max-width: 800px;
      height: 500px;
      border-radius: 16px;
      background: var(--component-bg);
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      overflow: hidden;
    }
    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--component-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%; max-width: 500px;
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      position: relative;
    }
    .modal-content h2 {
      color: var(--accent);
      margin-bottom: 12px;
    }
    .modal-content p {
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .modal-content img {
      display: block;
      margin-top: 15px;
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 4px 4px 8px rgba(0,0,0,0.2);
    }
    .modal-close {
      position: absolute;
      top: 10px; right: 10px;
      background: var(--component-bg);
      border: none;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
      border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--fg);
    }
    @media (max-width: 600px) {
      #jsme-container { height: 300px; }
      .toolbar button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <button id="themeToggle">Dark Mode</button>
  <h1>Chemical Structure Editor</h1>
  <div class="toolbar">
    <button id="newBtn">New</button>
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>
    <button id="clearBtn">Clear</button>
    <button id="searchBtn">Search Structure</button>
  </div>
  <div id="jsme-container"></div>

  <!-- Modal Info Box -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsme-editor@2024.4.29/jsme.nocache.js"></script>
  <script>
    let jsmeApplet, history = [], historyIndex = -1;
    function jsmeOnLoad() {
      const container = document.getElementById('jsme-container');
      jsmeApplet = new JSApplet.JSME('jsme-container', container.clientWidth + 'px', container.clientHeight + 'px', {});
      history = [jsmeApplet.molFile()]; historyIndex = 0;
      jsmeApplet.setCallBack('AfterStructureModified', event => {
        const mol = event.src.molFile();
        if (mol !== history[history.length - 1]) { history.push(mol); historyIndex = history.length - 1;
          if (history.length > 100) { history.shift(); historyIndex--; }}
      });
    }
    function clearAll() {
      jsmeApplet?.reset(); history = [jsmeApplet.molFile()]; historyIndex = 0;
    }
    function undo() {
      if (historyIndex > 0) {
        jsmeApplet.reset(); jsmeApplet.readMolFile(history[--historyIndex].replace(/\n/g,'|'));
      }
    }
    function redo() {
      if (historyIndex < history.length - 1) {
        jsmeApplet.reset(); jsmeApplet.readMolFile(history[++historyIndex].replace(/\n/g,'|'));
      }
    }
    async function searchStructure() {
      const smiles = jsmeApplet.smiles();
      if (!smiles) { alert('Draw a structure first.'); return; }
      const modal = document.getElementById('infoModal');
      const body = document.getElementById('modalBody');
      modal.classList.add('active');
      body.innerHTML = '<h2>Fetching Info...</h2>';
      try {
        const cidRes = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/smiles/${encodeURIComponent(smiles)}/cids/JSON`);
        const cid = (await cidRes.json()).IdentifierList.CID[0];
        const infoRes = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/Title,IUPACName,MolecularFormula,MolecularWeight,CanonicalSMILES/JSON`);
        const props = (await infoRes.json()).PropertyTable.Properties[0];
        const imgURL = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG`;
        body.innerHTML = `
          <h2>Compound Info</h2>
          <p><strong>Common Name:</strong> ${props.Title || 'N/A'}</p>
          <p><strong>IUPAC Name:</strong> ${props.IUPACName || 'N/A'}</p>
          <p><strong>Formula:</strong> ${props.MolecularFormula || 'N/A'}</p>
          <p><strong>Weight:</strong> ${props.MolecularWeight || 'N/A'}</p>
          <p><strong>SMILES:</strong> ${props.CanonicalSMILES || 'N/A'}</p>
          <img src="${imgURL}" alt="2D structure">
        `;
      } catch {
        body.innerHTML = '<p style="color:red;">Structure not found.</p>';
      }
    }
    window.onload = () => {
      document.getElementById('newBtn').onclick = clearAll;
      document.getElementById('clearBtn').onclick = clearAll;
      document.getElementById('undoBtn').onclick = undo;
      document.getElementById('redoBtn').onclick = redo;
      document.getElementById('searchBtn').onclick = searchStructure;
      document.getElementById('themeToggle').onclick = () => {
        document.body.classList.toggle('dark');
        document.getElementById('themeToggle').innerText = document.body.classList.contains('dark') ? 'Light Mode' : 'Dark Mode';
      };
      document.getElementById('modalClose').onclick = () => {
        document.getElementById('infoModal').classList.remove('active');
      };
    };
  </script>
</body>
</html>
